name: release

# Publishes ctxfold to npm via OIDC trusted publishing (no token).
# Provenance is attached automatically. Manual trigger only, so a
# publish never happens by accident — bump the version in package.json,
# then run this workflow from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read      # just needs to read the code
  id-token: write     # REQUIRED: lets the job mint the OIDC token npm verifies

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10.x; trusted publishing needs >= 11.5.1.
      # 'latest' is deliberate here — you want current fixes on the
      # publish path. Pin to a specific >=11.5.1 version if you prefer.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # Gate: never publish a red build. No deps to install (ctxfold
      # has none), so this runs the native test runner directly.
      - name: Test
        run: npm test

      # No NODE_AUTH_TOKEN — auth is the short-lived OIDC token.
      # --provenance is redundant under trusted publishing (it's on by
      # default) but kept explicit so intent is obvious.
      - name: Publish
        run: npm publish --provenance
